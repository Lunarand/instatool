name: InstaTool Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install essential dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests names user_agent mechanize pyfiglet
          pip install pyfiglet rich cfonts colorama user_agent brotli telebot instaloader stdiomask fake_useragent

      - name: Install all requested pips
        continue-on-error: true
        run: |
          pip install OneClick || true
          pip install stdiomask || true
          pip install user_agent || true
          pip install instaloader || true
          pip install rich || true
          pip install telebot || true
          pip install python-cfonts || true
          pip install pyfiglet || true
          pip install socks || true
          pip install youtube_dl || true
          pip install pafy || true
          pip install bs4 || true
          pip install InstagramAPI || true
          pip install generate_user_agent || true
          pip install selenium || true
          pip install asmix || true
          pip install curl2pyreqs || true
          pip install pycountry || true
          pip install ms4 || true
          pip install Topython || true
          pip install fake_useragent || true
          pip install mechanize || true
          pip install names || true
          pip install brotli || true

      # IMPORTANT FIX
      - name: Repair broken requests package
        run: |
          pip uninstall -y requests || true
          pip install --no-cache-dir requests==2.32.3

      - name: Run InstaTool
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python instatool.py
