name: InstaTool Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 1: Install essential packages (force latest requests to avoid MutableMapping error)
      - name: Install essential dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests
          pip install pyfiglet rich cfonts colorama user_agent brotli telebot instaloader stdiomask fake_useragent

      # Step 2: Install EVERY pip command from your script, ignore errors
      - name: Install all requested pips (from your script)
        continue-on-error: true
        run: |
          pip install OneClick || true
          pip install stdiomask || true
          pip install user_agent || true
          pip install instaloader || true
          pip install requests || true
          pip install rich || true
          pip install telebot || true
          pip install python-cfonts || true
          pip install pyfiglet || true
          pip install py_compile || true
          pip install socks || true
          pip install youtube_dl || true
          pip install uuid || true
          pip install time || true
          pip install os || true
          pip install random || true
          pip install datetime || true
          pip install string || true
          pip install secrets || true
          pip install webbrowser || true
          pip install hashlib || true
          pip install colorama || true
          pip install n || true
          pip install mm || true
          pip install new || true
          pip install sleep || true
          pip install BeautifulSoup || true
          pip install pafy || true
          pip install bs4 || true
          pip install sys || true
          pip install json || true
          pip install argparse || true
          pip install InstagramAPI || true
          pip install uuid4 || true
          pip install generate_user_agent || true
          pip install threading || true
          pip install token_hex || true
          pip install Fore || true
          pip install re || true
          pip install b || true
          pip install selenium || true
          pip install asmix || true
          pip install curl2pyreqs || true
          pip install pycountry || true
          pip install ms4 || true
          pip install Topython || true
          pip install fake_useragent || true
          pip install * || true
          # (Duplicate ones will just say "already satisfied", no harm)

      # Step 3: Run the actual script
      - name: Run InstaTool
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python instatool.py   # make sure the script is named instatool.py in repo root
